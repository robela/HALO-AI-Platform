# Cloud Build for HALO Africa Platform (Frontend + Backend).
#
# Branch strategy:
#   main    -> production services
#   develop -> staging services

substitutions:
  _REGION: us-central1
  _PROJECT_ID: main-presence-500410-f8
  _REPO: halo-platform
  _DEPLOY_ENV: ""
  _SERVICE_NAME_FRONTEND: ""
  _SERVICE_NAME_BACKEND: ""
  _SHORT_SHA: latest
  _BRANCH_NAME: manual
  _VITE_GOOGLE_CLIENT_ID: "397980615504-bk84p5ecc8ml3k5c6raccduk1okqvcdq.apps.googleusercontent.com"
  _VITE_API_BASE_URL: "http://localhost:8000"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: bash
    id: set-env
    entrypoint: bash
    args:
      - -c
      - |
        branch="${_BRANCH_NAME}"
        env="${_DEPLOY_ENV}"
        frontend_override="${_SERVICE_NAME_FRONTEND}"
        backend_override="${_SERVICE_NAME_BACKEND}"

        if [ -n "$$frontend_override" ]; then
          echo "$$frontend_override" > /workspace/FRONTEND_SERVICE_NAME
        elif [ "$$branch" = "main" ] || [ "$$env" = "production" ]; then
          echo "halo-africa-site" > /workspace/FRONTEND_SERVICE_NAME
        else
          echo "halo-africa-site-staging" > /workspace/FRONTEND_SERVICE_NAME
        fi

        if [ -n "$$backend_override" ]; then
          echo "$$backend_override" > /workspace/BACKEND_SERVICE_NAME
        elif [ "$$branch" = "main" ] || [ "$$env" = "production" ]; then
          echo "halo-backend" > /workspace/BACKEND_SERVICE_NAME
        else
          echo "halo-backend-staging" > /workspace/BACKEND_SERVICE_NAME
        fi

        if [ "$$branch" = "main" ] || [ "$$env" = "production" ]; then
          echo "production" > /workspace/APP_ENV
          echo "https://api.haloafrica.ai" > /workspace/VITE_API_BASE_URL
        else
          echo "staging" > /workspace/APP_ENV
          echo "https://staging-api.haloafrica.ai" > /workspace/VITE_API_BASE_URL
        fi

        echo "Branch           : $$branch"
        echo "Env              : $$(cat /workspace/APP_ENV)"
        echo "Frontend Service : $$(cat /workspace/FRONTEND_SERVICE_NAME)"
        echo "Backend Service  : $$(cat /workspace/BACKEND_SERVICE_NAME)"
        echo "API Base URL     : $$(cat /workspace/VITE_API_BASE_URL)"

  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    waitFor: [set-env]
    entrypoint: bash
    args:
      - -c
      - |
        api_url=$$(cat /workspace/VITE_API_BASE_URL)
        echo "🔨 Building frontend with API URL: $$api_url"
        docker build \
          --tag ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/halo-frontend:${_SHORT_SHA} \
          --tag ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/halo-frontend:${_BRANCH_NAME} \
          --build-arg VITE_GOOGLE_CLIENT_ID=${_VITE_GOOGLE_CLIENT_ID} \
          --build-arg VITE_API_BASE_URL=$$api_url \
          --file Dockerfile \
          .

  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    waitFor: [build-frontend]
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/halo-frontend"]

  - name: gcr.io/cloud-builders/docker
    id: build-backend
    waitFor: [set-env]
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/halo-backend:${_SHORT_SHA}
      - --tag
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/halo-backend:${_BRANCH_NAME}
      - --file
      - backend/Dockerfile
      - backend/

  - name: gcr.io/cloud-builders/docker
    id: push-backend
    waitFor: [build-backend]
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/halo-backend"]

  - name: gcr.io/cloud-builders/gcloud
    id: deploy-frontend
    waitFor: [push-frontend]
    entrypoint: bash
    args:
      - -c
      - |
        svc=$$(cat /workspace/FRONTEND_SERVICE_NAME | xargs)
        env=$$(cat /workspace/APP_ENV | xargs)
        echo "📦 Deploying frontend service: $$svc (env: $$env)"
        gcloud run deploy "$$svc" \
          --image="${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/halo-frontend:${_SHORT_SHA}" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=5 \
          --set-env-vars="APP_ENV=$$env"

  - name: gcr.io/cloud-builders/gcloud
    id: deploy-backend
    waitFor: [push-backend]
    entrypoint: bash
    args:
      - -c
      - |
        svc=$$(cat /workspace/BACKEND_SERVICE_NAME | xargs)
        env=$$(cat /workspace/APP_ENV | xargs)
        echo "📦 Deploying backend service: $$svc (env: $$env)"
        gcloud run deploy "$$svc" \
          --image="${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/halo-backend:${_SHORT_SHA}" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --port=8000 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=5 \
          --set-env-vars="APP_ENV=$$env,FRONTEND_URL=https://$$(cat /workspace/VITE_API_BASE_URL)"
        
        echo ""
        echo "✅ Backend deployed!"
        echo "Service URL: $$(gcloud run services describe "$$svc" --region="${_REGION}" --format='value(status.url)')"

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/halo-frontend:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/halo-frontend:${_BRANCH_NAME}
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/halo-backend:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/halo-backend:${_BRANCH_NAME}
